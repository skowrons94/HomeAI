# Casa home hub configuration - a reference of every option.
# You don't need to edit this: on first launch the web app's Welcome wizard creates
# config.toml, and everything is editable later in Settings (changes apply live).
# Every [plugins.<name>] table enables that plugin; `enabled = false` switches one off.
name = "Casa"
rooms = ["Soggiorno", "Cucina", "Camera", "Bagno", "Studio"]

[web]
port = 8080
# password = ""          # set one if the UI should ask for a password

[homekit]
name = "Casa"
port = 51826

[notify]
# Free push notifications: install the "ntfy" app, subscribe to a topic with a
# hard-to-guess name and put the same URL here.
# ntfy_url = "https://ntfy.sh/casa-change-me-123"
# telegram_token = ""
# telegram_chat_id = ""

# Ariston NET boiler (cloud). Exposed to HomeKit as thermostats.
[plugins.ariston]
username = "your-ariston-net-email@example.com"
password = "your-ariston-net-password"
gateway = ""                 # empty = first boiler on the account
poll_interval = 120          # seconds, >= 60
expose_hot_water = true
zone_names = { "1" = "Heating" }

# KEF LSX / LS50 Wireless (first generation), TCP port 50001.
[plugins.kef]
host = "192.168.1.43"
name = "KEF LSX"
room = "Soggiorno"
# poll_interval = 10

# Bluetooth LE sensors (Govee, Xiaomi pvvx/ATC, BTHome, SwitchBot, Qingping, Inkbird...).
# Recognised sensors are added when first heard; manage them in Settings > Bluetooth.
[plugins.bluetooth]
auto_add = true
homekit = true
stale_minutes = 30
# adapter = "hci0"

# Apple TV: pair from the web UI (Settings → Apple TV), a PIN shows on the TV.
[plugins.appletv]
name = "Apple TV"
room = "Soggiorno"
# host = "192.168.1.102"
# identifier = ""            # set automatically by pairing

# Hisense VIDAA TV: Wake-on-LAN + on/off status. Remote keys are EXPERIMENTAL
# and need the RemoteNOW client certificate/key files.
[plugins.hisense]
host = "192.168.1.136"
mac = "aa:bb:cc:dd:ee:ff"
name = "TV Soggiorno"
room = "Soggiorno"
# certfile = "data/hisense/rcm_certchain_pem.cer"
# keyfile = "data/hisense/rcm_pem_privkey.pkcs8"

# IKEA DIRIGERA hub: pair from the web UI (press the button on the hub).
[plugins.dirigera]
host = ""                    # empty = discover with mDNS
homekit = false              # DIRIGERA can join Apple Home itself via Matter

# Everything the hub sees on the network (mDNS + ARP).
[plugins.network]
arp = true

# CPU, memory, disk, network traffic, Wi-Fi signal and internet latency of the hub.
[plugins.system]
interval = 15

# Recipes: search GialloZafferano / TheMealDB or import any recipe URL; saved locally.
[plugins.recipes]
daily_kcal_goal = 2000
default_servings = 2
language = "it"
# sources = ["giallozafferano", "themealdb"]

# Shared feed: watched/ratings/watchlist and shared recipes with other houses, through a private git repo.
# Generate the SSH key on first start, then add its public key (Settings > Shared feed) as a deploy key
# with write access. See docs/sync.md.
# [plugins.sync]
# repo_url = "git@github.com:you/casa-feed.git"
# user = "mango"
# share_watchlist = true
# branch = "main"
# interval = 10                 # minutes
# key_path = ""                 # empty: data/sync/id_ed25519

# NAS: discovered and mounted from Settings > Storage & NAS.
[plugins.storage]
auto_mount = true

[plugins.storage.nas]
host = "NAS.local"
share = "Multimedia"
mount_point = "/mnt/nas"
version = "2.0"               # old QNAP firmware; "auto" for recent NAS
# username = ""
# password = ""

[plugins.media]
# Movie/series metadata. Free key: themoviedb.org -> Settings -> API (v3 key or v4 token).
# Empty = Cinemeta (no key, English only) so it works out of the box.
tmdb_api_key = ""
language = "it-IT"
languages = ["it", "en"]      # audio priority: Italian first, then English
quality = "1080p"             # preferred; 2160p also accepted when allow_4k
allow_4k = true
max_movie_gb = 20
max_episode_gb = 4
# NAS library (mounted on the Pi, see README). Mac test alternative:
# movies_dir = "/Volumes/Multimedia/movies"
movies_dir = "/mnt/nas/movies"
series_dir = "/mnt/nas/series"
download_dir = "/mnt/nas/downloads/incomplete"   # where Transmission writes
post_process = "move"         # move | copy (keep seeding to seed_ratio) | none
seed_ratio = 0
auto_download = false         # default for new favourites
italian_grace_days = 3        # wait this long for an Italian release before taking English
# indexers = ["torrentio", "knaben", "apibay", "eztv", "yts", "ilcorsaronero", "1337x"]
# mirrors = { yts = ["https://yts.gg"] }

[plugins.media.transmission]
# enabled = false              # never contact Transmission from this hub (dev/test machine)
url = "http://127.0.0.1:9091/transmission/rpc"
# username = ""
# password = ""

[plugins.media.proxy]
# Route tracker/metadata traffic through a proxy to reach DNS-blocked trackers
# (ilCorSaRoNeRo, 1337x, YTS mirrors). socks5h = DNS resolved by the proxy.
# url = "socks5h://user:pass@host:1080"   or   "http://host:3128"
url = ""

[plugins.torrents]
# Search box over the providers you enable (docs/torrents.md). "internetarchive" works out of the box.
providers = ["internetarchive"]   # initial default only; the Trackers menu in the page overrides it
# extra_dir = "/home/pi/casa-sources"   # your own provider .py files
# timeout = 10
# page_size = 20

[plugins.games]
# Games on the NAS -> Steam Deck (docs/games.md). Needs the agent on the Deck (deploy/deck/).
# library = "/mnt/nas/games"        # default: <NAS mount>/games, with pc/ and emu/<system>/
# base_url = "http://casa.local:8080"   # only if the Deck can't reach the address you use in the app
[plugins.games.deck]
host = "steamdeck.local"
token = ""                           # printed by deploy/deck/install-deck.sh
# port = 8765
